h1{

.question-title{

.bangla-box{

/* Auto speak indicator */

.speak-status{

    text-align:center;

    font-size:14px;

    color:#673ab7;

    min-height:22px;

    margin-bottom:8px;
}


/* Listen button */

.listen-btn{

    width:100%;

    border:0;

    padding:12px;

    border-radius:9px;

    background:#673ab7;

    color:white;

    font-size:16px;

    cursor:pointer;

    margin-bottom:16px;
}


/* Voice answer button */

.voice-btn{

    width:100%;

    border:0;

    padding:14px;

    border-radius:9px;

    background:#009688;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    margin-bottom:10px;
}


.voice-btn.listening{

    background:#e91e63;

    animation:pulse 1s infinite;
}


@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.02);
    }

    100%{
        transform:scale(1);
    }

}


.voice-info{

    text-align:center;

    font-size:13px;

    color:#777;

    margin-bottom:14px;
}


label{

    display:block;

    font-weight:bold;

    margin-bottom:8px;
}


textarea{

    width:100%;

    min-height:100px;

    border:2px solid #ccc;

    border-radius:10px;

    padding:13px;

    font-size:19px;

    resize:none;

    outline:none;

    font-family:Arial,sans-serif;
}


textarea:focus{

    border-color:#2196f3;
}


.status{

    min-height:25px;

    margin-top:8px;

    font-size:14px;

    color:#777;
}


.button-row{

    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:8px;

    margin-top:8px;

button{

    border:0;

    border-radius:9px;

    padding:12px 8px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

.previous{

    background:#607d8b;

    color:white;
}


.check{

    background:#2196f3;

    color:white;
}


.next{

    background:#4caf50;

    color:white;
}


.reset{

    width:100%;

    background:#f44336;

    color:white;

    margin-top:9px;

/* Result */

.result{

.correct{

.wrong{

.result-title{

];


/* =====================================================
   VARIABLES
===================================================== */


let currentQuestion = 0;

let score = 0;

let attempts = 0;

let answered = false;

let autoNextTimer = null;

let recognition = null;

let isListening = false;


/* =====================================================
   ELEMENTS
===================================================== */


const banglaSentence =
document.getElementById(
"banglaSentence"
);


const answerInput =
document.getElementById(
"answerInput"
);


const resultBox =
document.getElementById(
"resultBox"
);


const resultTitle =
document.getElementById(
"resultTitle"
);


const resultMessage =
document.getElementById(
"resultMessage"
);


const userAnswerDisplay =
document.getElementById(
"userAnswerDisplay"
);


const attemptCount =
document.getElementById(
"attemptCount"
);


const typingStatus =
document.getElementById(
"typingStatus"
);


const suggestionBox =
document.getElementById(
"suggestionBox"
);


const suggestionAnswer =
document.getElementById(
"suggestionAnswer"
);


const voiceButton =
document.getElementById(
"voiceButton"
);


const voiceInfo =
document.getElementById(
"voiceInfo"
);


const speakStatus =
document.getElementById(
"speakStatus"
);


/* =====================================================
   LOAD QUESTION
===================================================== */


function loadQuestion(){

    clearTimeout(autoNextTimer);

    stopListening();


    const q =
    questions[currentQuestion];


    banglaSentence.innerText =
    q.bn;


    document.getElementById(
    "questionNumber"
    ).innerText =
    currentQuestion + 1;


    document.getElementById(
    "questionCounter"
    ).innerText =
    "বাক্য " +
    (currentQuestion + 1) +
    "/" +
    questions.length;


    answerInput.value = "";


    resultBox.style.display =
    "none";


    suggestionBox.style.display =
    "none";


    answered = false;


    attempts = 0;


    attemptCount.innerText =
    "0";


    typingStatus.innerText =
    "Sentence-এর শেষে . অথবা ? অথবা ! দিন";


    typingStatus.style.color =
    "#777";


    document.getElementById(
    "scoreText"
    ).innerText =
    "স্কোর: " + score;


    document.getElementById(
    "totalScore"
    ).innerText =
    score;


    /*
     * নতুন প্রশ্ন আসার সাথে সাথে
     * automatically বাংলা প্রশ্ন বলবে।
     */

    setTimeout(function(){

        speakQuestion();

    },500);

}


/* =====================================================
   AUTO SPEAK QUESTION
===================================================== */


function speakQuestion(){

    if(
        !("speechSynthesis" in window)
    ){

        speakStatus.innerText =
        "আপনার browser speech support করে না";

        return;
    }


    const text =
    questions[currentQuestion].bn;


    speechSynthesis.cancel();


    const speech =
    new SpeechSynthesisUtterance(text);


    speech.lang =
    "bn-BD";


    speech.rate =
    0.85;


    speech.pitch =
    1;


    speech.onstart =
    function(){

        speakStatus.innerText =
        "🔊 প্রশ্ন শোনা হচ্ছে...";

    };


    speech.onend =
    function(){

        speakStatus.innerText =
        "✓ প্রশ্ন বলা শেষ";

    };


    speech.onerror =
    function(){

        speakStatus.innerText =
        "🔊 আবার শুনতে button চাপুন";

    };


    speechSynthesis.speak(
    speech
    );

}


/* =====================================================
   PUNCTUATION CHECK
===================================================== */


function hasEndingPunctuation(text){

    text =
    text.trim();


    if(text.length === 0){

        return false;

    }


    const lastCharacter =
    text.charAt(
    text.length - 1
    );


    return(

        lastCharacter === "." ||

        lastCharacter === "?" ||

        lastCharacter === "!"

    );

}


/* =====================================================
   NORMALIZE
===================================================== */


function normalizeSentence(text){

    return text

    .trim()

    .toLowerCase()

    .replace(/[.!?]+$/,"")

    .replace(/\s+/g," ");

}


/* =====================================================
   VOICE ANSWER
===================================================== */


function startVoiceAnswer(){

    if(isListening){

        stopListening();

        return;
    }


    /*
     * Browser Speech Recognition
     */

    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
        "আপনার browser Voice Recognition support করে না। Android Chrome ব্যবহার করে চেষ্টা করুন।"
        );

        return;

    }


    recognition =
    new SpeechRecognition();


    recognition.lang =
    "en-US";


    recognition.continuous =
    false;


    recognition.interimResults =
    true;


    recognition.maxAlternatives =
    1;


    isListening = true;


    voiceButton.classList.add(
    "listening"
    );


    voiceButton.innerText =
    "🔴 Listening... আবার চাপলে বন্ধ হবে";


    voiceInfo.innerText =
    "English-এ sentence বলুন...";


    typingStatus.innerText =
    "🎤 আপনার কথা শোনা হচ্ছে...";


    typingStatus.style.color =
    "#e91e63";


    recognition.onresult =
    function(event){

        let finalText = "";


        for(
            let i =
            event.resultIndex;

            i <
            event.results.length;

            i++
        ){

            const transcript =
            event.results[i][0].transcript;


            if(
                event.results[i].isFinal
            ){

                finalText +=
                transcript;

            }

        }


        if(finalText){

            /*
             * Voice থেকে পাওয়া text
             * textarea-তে বসবে।
             */

            answerInput.value =
            finalText.trim();


            /*
             * Voice recognition সাধারণত
             * punctuation নাও দিতে পারে।
             *
             * তাই punctuation না থাকলে
             * user নিজে শেষে . ? ! দিতে পারবেন।
             */

            if(
                hasEndingPunctuation(
                answerInput.value
                )
            ){

                checkAnswer();

            }

            else{

                typingStatus.innerText =
                "Voice answer পাওয়া গেছে। শেষে . অথবা ? অথবা ! দিন";

                typingStatus.style.color =
                "#777";

                answerInput.focus();

            }

        }

    };


    recognition.onerror =
    function(event){

        isListening = false;

        voiceButton.classList.remove(
        "listening"
        );


        voiceButton.innerText =
        "🎤 English-এ উত্তর বলুন";


        if(
            event.error ===
            "not-allowed"
        ){

            voiceInfo.innerText =
            "Microphone permission দিন।";

        }

        else{

            voiceInfo.innerText =
            "Voice input আবার চেষ্টা করুন।";

        }

    };


    recognition.onend =
    function(){

        isListening = false;

        voiceButton.classList.remove(
        "listening"
        );


        voiceButton.innerText =
        "🎤 English-এ উত্তর বলুন";

    };


    recognition.start();

}


/* =====================================================
   STOP VOICE
===================================================== */


function stopListening(){

    if(
        recognition &&
        isListening
    ){

        try{

            recognition.stop();

        }

        catch(e){}

    }


    isListening = false;


    voiceButton.classList.remove(
    "listening"
    );


    voiceButton.innerText =
    "🎤 English-এ উত্তর বলুন";

}


/* =====================================================
   TYPING
===================================================== */


answerInput.addEventListener(
"input",
function(){

    if(answered){

        return;

    }


    const text =
    answerInput.value.trim();


    /*
     * IMPORTANT:
     *
     * . ? !
     * ছাড়া কোনো result হবে না।
     */

    if(
        !hasEndingPunctuation(text)
    ){

        typingStatus.innerText =
        "লিখতে থাকুন... শেষে . অথবা ? অথবা ! দিন";

        typingStatus.style.color =
        "#777";

        return;

    }


    /*
     * punctuation পাওয়া গেছে।
     * Automatically check.
     */

    typingStatus.innerText =
    "Answer checking...";


    typingStatus.style.color =
    "#2196f3";


    clearTimeout(
    autoNextTimer
    );


    autoNextTimer =
    setTimeout(
    function(){

        checkAnswer();

    },
    250
    );

});


/* =====================================================
   CHECK ANSWER
===================================================== */


function checkAnswer(){

    if(answered){

        return;

    }


    const userAnswer =
    answerInput.value.trim();


    /*
     * punctuation ছাড়া
     * কখনো check হবে না।
     */

    if(
        !hasEndingPunctuation(
        userAnswer
        )
    ){

        typingStatus.innerText =
        "Result পেতে শেষে . অথবা ? অথবা ! দিন";

        typingStatus.style.color =
        "#f44336";

        return;

    }


    attempts++;


    attemptCount.innerText =
    attempts;


    const correct =
    questions[currentQuestion].en;


    const userNormalized =
    normalizeSentence(
    userAnswer
    );


    const correctNormalized =
    normalizeSentence(
    correct
    );


    /*
     * CORRECT
     */

    if(
        userNormalized ===
        correctNormalized
    ){

        answered = true;


        score++;


        resultBox.className =
        "result correct";


        resultBox.style.display =
        "block";


        resultTitle.innerText =
        "সঠিক উত্তর! 🎉";


        resultMessage.innerText =
        "খুব ভালো! আপনি সঠিক English বাক্য লিখেছেন।";


        userAnswerDisplay.innerText =
        userAnswer;


        suggestionBox.style.display =
        "none";


        document.getElementById(
        "scoreText"
        ).innerText =
        "স্কোর: " + score;


        document.getElementById(
        "totalScore"
        ).innerText =
        score;


        typingStatus.innerText =
        "✓ সঠিক! পরের প্রশ্ন আসছে...";


        typingStatus.style.color =
        "#4caf50";


        /*
         * AUTO NEXT
         */

        autoNextTimer =
        setTimeout(
        function(){

            nextQuestion();

        },
        1800
        );

    }


    /*
     * WRONG
     */

    else{

        resultBox.className =
        "result wrong";


        resultBox.style.display =
        "block";


        resultTitle.innerText =
        "❌ ভুল উত্তর!";


        resultMessage.innerText =
        "আপনার উত্তরটি সঠিক নয়। নিচে সঠিক উত্তরটি দেখুন।";


        userAnswerDisplay.innerText =
        userAnswer;


        /*
         * Correct Answer Suggestion
         */

        suggestionBox.style.display =
        "block";


        suggestionAnswer.innerText =
        correct;


        typingStatus.innerText =
        "আবার চেষ্টা করুন অথবা সঠিক বাক্যটি দেখে অনুশীলন করুন।";


        typingStatus.style.color =
        "#f44336";

    }

}


/* =====================================================
   MANUAL CHECK
===================================================== */


function manualCheck(){

    const text =
    answerInput.value.trim();


    /*
     * punctuation ছাড়া
     * result দেখাবে না।
     */

    if(
        !hasEndingPunctuation(text)
    ){

        typingStatus.innerText =
        "আগে sentence-এর শেষে . অথবা ? অথবা ! দিন";

        typingStatus.style.color =
        "#f44336";

        answerInput.focus();

        return;

    }


    checkAnswer();

}


/* =====================================================
   NEXT
===================================================== */


function nextQuestion(){

    clearTimeout(
    autoNextTimer
    );


    if(
        currentQuestion <
        questions.length - 1
    ){

        currentQuestion++;


        loadQuestion();

    }

    else{

        resultBox.className =
        "result correct";


        resultBox.style.display =
        "block";


        resultTitle.innerText =
        "🎉 Practice Complete!";


        resultMessage.innerText =
        "আপনি সবগুলো sentence শেষ করেছেন।";


        userAnswerDisplay.innerText =
        "";


        suggestionBox.style.display =
        "none";


        typingStatus.innerText =
        "আপনার Practice সম্পূর্ণ হয়েছে।";


        typingStatus.style.color =
        "#4caf50";

    }

}


/* =====================================================
   PREVIOUS
===================================================== */


function previousQuestion(){

    clearTimeout(
    autoNextTimer
    );


    if(
        currentQuestion > 0
    ){

        currentQuestion--;

        loadQuestion();

    }

}


/* =====================================================
   RESET
===================================================== */


function resetPractice(){

    clearTimeout(
    autoNextTimer
    );


    stopListening();


    if(
        "speechSynthesis" in window
    ){

        speechSynthesis.cancel();

    }


    currentQuestion = 0;

    score = 0;

    attempts = 0;

    answered = false;


    loadQuestion();

}


/* =====================================================
   START
===================================================== */


loadQuestion();


</script>
