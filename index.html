    }

    }

        background: #ff9800;
        color: white;
        border: none;
        padding: 12px 22px;
        border-radius: 30px;
        font-size: 17px;
        cursor: pointer;
    }

    .speak-btn:hover {
        background: #f57c00;
    }

    label {
        display: block;
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    textarea {
        width: 100%;
        min-height: 100px;
        resize: vertical;
        border: 2px solid #90caf9;
        border-radius: 12px;
        padding: 15px;
        font-size: 18px;
        font-family: Arial, sans-serif;
        outline: none;
    }

    textarea:focus {
        border-color: #1565c0;
        box-shadow: 0 0 0 3px rgba(21,101,192,0.12);
    }

    .buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
    }

    button {
        border: none;
        cursor: pointer;
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 16px;
        font-weight: bold;
    }

    .check {
        background: #2e7d32;
        color: white;
        flex: 1;
    }

    }

    .previous {

        color: white;
    }

    .next {
        background: #1565c0;
        color: white;
    }

        color: white;
    }

        padding: 18px;
        border-radius: 12px;
        display: none;
        font-size: 18px;
        line-height: 1.7;
    }

        color: #1b5e20;
    }

    }

        }

</style>
</head>

            <button class="next" onclick="nextQuestion()">

</div>

    answerBox.value = "";

    resultBox.style.display = "none";

    resultBox.className = "result";


    /*
       যদি আগে উত্তর দেওয়া হয়ে থাকে,
       তাহলে সেই উত্তর আবার দেখানো হবে।
    */

    if (answered[currentQuestion]) {

        answerBox.value =
            results[currentQuestion].userAnswer;

        showPreviousResult();

    }

    answerBox.focus();
}


/* =========================
   Check Answer
========================= */

function checkAnswer() {

    const userAnswer =
        answerBox.value.trim();

    if (userAnswer === "") {

        alert("দয়া করে আগে English উত্তর লিখুন।");

        answerBox.focus();

        return;
    }


    /*
       একই প্রশ্ন বারবার Check করলে
       score/attempt বাড়বে না।
    */

    if (answered[currentQuestion]) {

        showPreviousResult();

        return;
    }


    const correctAnswer =
        sentences[currentQuestion].en;

    const userNormalized =
        normalizeText(userAnswer);

    const correctNormalized =
        normalizeText(correctAnswer);


    attempts++;

    answered[currentQuestion] = true;


    if (userNormalized === correctNormalized) {

        score++;

        results[currentQuestion] = {

            correct: true,

            userAnswer: userAnswer

        };

        showCorrect();

    } else {

        results[currentQuestion] = {

            correct: false,

            userAnswer: userAnswer

        };

        showWrong();

    }

    updateScore();

}


/* =========================
   Text Normalization
========================= */

function normalizeText(text) {

    return text
        .toLowerCase()
        .trim()
        .replace(/[.,!?;:]/g, "")
        .replace(/\s+/g, " ");

}


/* =========================
   Correct
========================= */

function showCorrect() {

    resultBox.className =
        "result correct";

    resultBox.innerHTML =

        "✅ <strong>সঠিক উত্তর!</strong><br>" +

        "খুব ভালো! আপনি সঠিক English বাক্য লিখেছেন।";

    resultBox.style.display = "block";
}


/* =========================
   Wrong
========================= */

function showWrong() {

    const correctAnswer =
        sentences[currentQuestion].en;

    resultBox.className =
        "result wrong";

    resultBox.innerHTML =

        "❌ <strong>ভুল উত্তর।</strong><br>" +

        "সঠিক English উত্তর:<div class='answer'>" +

        correctAnswer +

        "</div>";

    resultBox.style.display = "block";
}


/* =========================
   Previous Result
========================= */

function showPreviousResult() {

    if (!results[currentQuestion]) {

        return;

    }

    if (results[currentQuestion].correct) {

        showCorrect();

    } else {

        showWrong();

    }

}


/* =========================
   Next Question
========================= */

function nextQuestion() {

    if (currentQuestion < sentences.length - 1) {

        currentQuestion++;

        showQuestion();

    } else {

        showFinalResult();

    }

}


/* =========================
   Previous Question
========================= */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();

    }

}


/* =========================
   Update Score
========================= */

function updateScore() {

    scoreText.textContent =
        "স্কোর: " + score;

    correctCount.textContent =
        score;

    attemptCount.textContent =
        attempts;

}


/* =========================
   Final Result
========================= */

function showFinalResult() {

    let percentage =
        Math.round((score / sentences.length) * 100);

    let message = "";

    if (percentage >= 90) {

        message = "🏆 অসাধারণ! আপনার English খুব ভালো।";

    } else if (percentage >= 70) {

        message = "👏 খুব ভালো! আরও একটু practice করুন।";

    } else if (percentage >= 50) {

        message = "👍 ভালো চেষ্টা! আরও practice করলে ভালো করবেন।";

    } else {

        message = "💪 চিন্তা করবেন না। নিয়মিত practice করুন।";

    }


    resultBox.className =
        "result correct";

    resultBox.innerHTML =

        "<strong>🎉 ১০০টি বাক্য সম্পন্ন!</strong><br><br>" +

        "আপনার স্কোর: " +

        score +

        " / " +

        sentences.length +

        "<br>" +

        "শতকরা: " +

        percentage +

        "%<br><br>" +

        message;

    resultBox.style.display = "block";

}


/* =========================
   Reset Quiz
========================= */

function resetQuiz() {

    const confirmReset =
        confirm("আপনি কি পুরো Quiz আবার শুরু করতে চান?");

    if (!confirmReset) {

        return;

    }

    currentQuestion = 0;

    score = 0;

    attempts = 0;

    answered =
        new Array(sentences.length).fill(false);

    results =
        new Array(sentences.length).fill(null);

    showQuestion();

}


/* =========================
   Bangla Speech
========================= */

function speakBangla() {

    if (!("speechSynthesis" in window)) {

        alert(
            "আপনার browser বাংলা Speech Support করে না।"
        );

        return;
    }


    window.speechSynthesis.cancel();


    const text =
        sentences[currentQuestion].bn;

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "bn-BD";

    speech.rate = 0.85;

    speech.pitch = 1;

    speech.volume = 1;


    /*
       কিছু ডিভাইসে bn-BD voice না থাকলে
       available Bengali voice খুঁজবে।
    */

    const voices =
        window.speechSynthesis.getVoices();

    const banglaVoice =
        voices.find(function(voice) {

            return (
                voice.lang.toLowerCase()
                .startsWith("bn")
            );

        });


    if (banglaVoice) {

        speech.voice = banglaVoice;

    }


    window.speechSynthesis.speak(speech);

}


/* =========================
   Keyboard Shortcut
========================= */

answerBox.addEventListener(
    "keydown",
    function(event) {

        /*
           Ctrl + Enter = Check
        */

        if (
            event.ctrlKey &&
            event.key === "Enter"
        ) {

            checkAnswer();

        }

        /*
           Enter নয়, Ctrl+Enter ব্যবহার করতে হবে
           যাতে সাধারণ typing-এর সময় সমস্যা না হয়।
        */

    }
);


/* =========================
   Load Voices
========================= */

if ("speechSynthesis" in window) {

    window.speechSynthesis.onvoiceschanged =
        function() {

            window.speechSynthesis.getVoices();

        };

}


/* =========================
   Start Quiz
========================= */

showQuestion();

</script>
