/* =====================================================

let currentQuestion = 0;

let score = 0;

let attempts = 0;

let answered = false;

let autoNextTimer = null;


/* =====================================================

===================================================== */

document.getElementById("banglaSentence");

const answerInput =
document.getElementById("answerInput");

const resultBox =
document.getElementById("resultBox");

const resultTitle =
document.getElementById("resultTitle");

const resultMessage =
document.getElementById("resultMessage");

const correctAnswer =
document.getElementById("correctAnswer");

const attemptCount =
document.getElementById("attemptCount");

const typingStatus =
document.getElementById("typingStatus");


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion(){

    clearTimeout(autoNextTimer);

    const question =
    questions[currentQuestion];

    banglaSentence.innerText =
    question.bn;

    document.getElementById(
        "questionNumber"
    ).innerText =
    currentQuestion + 1;

    document.getElementById(
        "questionCounter"
    ).innerText =
    "বাক্য " +
    (currentQuestion + 1) +
    "/" +
    questions.length;

    answerInput.value = "";

    resultBox.style.display = "none";

    answered = false;

    attempts = 0;

    attemptCount.innerText = "0";

    typingStatus.innerText =
    "Sentence-এর শেষে . অথবা ? অথবা ! দিন";

    typingStatus.style.color =
    "#777";

    document.getElementById(
        "scoreText"
    ).innerText =
    "স্কোর: " + score;

    document.getElementById(
        "totalScore"
    ).innerText =
    score;

    answerInput.focus();
}


/* =====================================================
   CHECK LAST CHARACTER
   VERY IMPORTANT
===================================================== */

function hasEndingPunctuation(text){

    text = text.trim();

    if(text.length === 0){

        return false;
    }

    const lastCharacter =
    text.charAt(text.length - 1);

    return (
        lastCharacter === "." ||
        lastCharacter === "?" ||
        lastCharacter === "!"
    );
}


/* =====================================================
   USER TYPING
===================================================== */

answerInput.addEventListener(
    "input",
    function(){

        if(answered){

            return;
        }

        const text =
        answerInput.value.trim();


        /*
         * যতক্ষণ পর্যন্ত sentence-এর
         * শেষে . ? ! নেই,
         * ততক্ষণ কোনো result হবে না।
         */

        if(
            !hasEndingPunctuation(text)
        ){

            typingStatus.innerText =
            "লিখতে থাকুন... শেষে . অথবা ? অথবা ! দিন";

            typingStatus.style.color =
            "#777";

            return;
        }


        /*
         * punctuation পাওয়া গেছে।
         * এখন automatically answer check হবে।
         */

        typingStatus.innerText =
        "Answer checking...";

        typingStatus.style.color =
        "#2196f3";


        clearTimeout(autoNextTimer);

        autoNextTimer =
        setTimeout(
            function(){

                checkAnswer();

            },
            200
        );

    }
);


/* =====================================================
   NORMALIZE ANSWER
===================================================== */

function normalizeSentence(text){

    return text
    .trim()
    .toLowerCase()
    .replace(/[.!?]+$/,"")
    .replace(/\s+/g," ");

}

        return;
    }

    const userAnswer =
    answerInput.value.trim();


    /*
     * Punctuation ছাড়া কখনো check হবে না।
     */

    if(
        !hasEndingPunctuation(userAnswer)
    ){

        typingStatus.innerText =
        "আগে sentence-এর শেষে . অথবা ? অথবা ! দিন";

        typingStatus.style.color =
        "#f44336";

        return;
    }


    attempts++;

    attemptCount.innerText =
    attempts;


    const correct =
    questions[currentQuestion].en;


    const userNormalized =
    normalizeSentence(userAnswer);

    const correctNormalized =
    normalizeSentence(correct);


    /* =================================================
       CORRECT
    ================================================= */

    if(
        userNormalized ===
        correctNormalized
    ){

        answered = true;

        score++;


        resultBox.className =
        "result correct";

        resultBox.style.display =
        "block";


        resultTitle.innerText =
        "সঠিক উত্তর!";


        resultMessage.innerText =
        "খুব ভালো! আপনি সঠিক English বাক্য লিখেছেন।";


        correctAnswer.innerText =
        correct;


        document.getElementById(
            "scoreText"
        ).innerText =
        "স্কোর: " + score;


        document.getElementById(
            "totalScore"
        ).innerText =
        score;


        typingStatus.innerText =
        "সঠিক! পরের প্রশ্ন আসছে...";

        typingStatus.style.color =
        "#4caf50";


        /*
         * AUTO NEXT
         */

        autoNextTimer =
        setTimeout(
            function(){

                nextQuestion();

            },
            1500
        );

    }


    /* =================================================
       WRONG
    ================================================= */

    else{

        resultBox.className =
        "result wrong";

        resultBox.style.display =
        "block";


        resultTitle.innerText =
        "ভুল উত্তর!";


        resultMessage.innerText =
        "আবার চেষ্টা করুন।";


        correctAnswer.innerText =
        correct;


        typingStatus.innerText =
        "আবার সঠিক English sentence লিখুন এবং শেষে . ? অথবা ! দিন";

        typingStatus.style.color =
        "#f44336";

    }

}


/* =====================================================
   CHECK BUTTON
===================================================== */

function manualCheck(){

    const text =
    answerInput.value.trim();


    /*
     * punctuation না থাকলে
     * কোনো result দেখাবে না।
     */

    if(
        !hasEndingPunctuation(text)
    ){

        typingStatus.innerText =
        "Result পেতে sentence-এর শেষে . অথবা ? অথবা ! দিন";

        typingStatus.style.color =
        "#f44336";

        answerInput.focus();

        return;
    }


    checkAnswer();
}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    clearTimeout(autoNextTimer);


    if(
        currentQuestion <
        questions.length - 1
    ){

        currentQuestion++;

        loadQuestion();

    }

    else{

        resultBox.className =
        "result correct";

        resultBox.style.display =
        "block";

        resultTitle.innerText =
        "🎉 Practice Complete!";

        resultMessage.innerText =
        "আপনি সবগুলো sentence শেষ করেছেন।";

        correctAnswer.innerText =
        "";

        typingStatus.innerText =
        "Practice সম্পূর্ণ হয়েছে।";

    }

}


/* =====================================================
   PREVIOUS QUESTION
===================================================== */

function previousQuestion(){

    clearTimeout(autoNextTimer);


    if(currentQuestion > 0){

        currentQuestion--;

        loadQuestion();

    }

}


/* =====================================================
   RESET
===================================================== */

function resetPractice(){

    clearTimeout(autoNextTimer);

    currentQuestion = 0;

    score = 0;

    attempts = 0;

    answered = false;

    loadQuestion();

}


/* =====================================================
   BANGLA SPEECH
===================================================== */

function speakBangla(){

    const text =
    questions[currentQuestion].bn;


    if(
        "speechSynthesis" in window
    ){

        const speech =
        new SpeechSynthesisUtterance(text);

        speech.lang = "bn-BD";

        speech.rate = 0.9;

        speechSynthesis.cancel();

        speechSynthesis.speak(
            speech
        );

    }

    else{

        alert(
            "আপনার Browser Speech Support করে না।"
        );

    }

}


/* =====================================================
   START
===================================================== */

loadQuestion();

</script>
